name: CI
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: talentos
          POSTGRES_USER: talentos
          POSTGRES_PASSWORD: talentos_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli + nextest
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,rustls
          cargo install cargo-nextest --locked
      - name: Install protoc
        # temporalio-protos generates code at build time when the worker is re-enabled.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run migrations
        env:
          DATABASE_URL: postgres://talentos:talentos_ci@localhost:5432/talentos
        run: sqlx migrate run
      - name: Prepare sqlx offline cache
        env:
          DATABASE_URL: postgres://talentos:talentos_ci@localhost:5432/talentos
        run: cargo sqlx prepare --workspace
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          DATABASE_URL: postgres://talentos:talentos_ci@localhost:5432/talentos
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        env:
          DATABASE_URL: postgres://talentos:talentos_ci@localhost:5432/talentos
        run: cargo nextest run --workspace --no-fail-fast

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-release:
    needs: [quality, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: talentos/api-gw:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max