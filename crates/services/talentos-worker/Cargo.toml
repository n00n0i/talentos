[package]
name = "talentos-worker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "talentos-worker"
path = "src/main.rs"

[dependencies]
talentos-kernel = { path = "../../core/kernel" }
talentos-compliance = { path = "../../domain/talentos-compliance" }
talentos-payroll = { path = "../../domain/talentos-payroll" }
talentos-db = { path = "../../infra/db" }
temporalio-sdk = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = "0.15"
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = "1"