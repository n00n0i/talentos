services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talentos
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: ${PG_PASSWORD:-talentos_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos -d talentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_secret
    volumes:
      - temporal-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      temporal-postgres:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_secret
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_secret}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-talentos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: talentos-gateway:latest
    build: .
    command: ["migrate"]
    environment:
      DATABASE_ADMIN_URL: postgres://talentos:${PG_PASSWORD:-talentos_dev_secret}@postgres:5432/talentos
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_dev_secret}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: talentos-gateway:latest
    build: .
    environment:
      DATABASE_URL: postgres://talentos_app:${APP_DB_PASSWORD:-app_dev_secret}@postgres:5432/talentos
      DATABASE_AUTH_URL: postgres://talentos_auth:${AUTH_DB_PASSWORD:-auth_dev_secret}@postgres:5432/talentos
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_secret}@redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-me-in-prod-minimum-32-bytes-okay!!}
      AUTH_ALLOWED_ORIGINS: ${APP_URL:-http://localhost}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      GATEWAY_PORT: "8080"
      PAYSLIP_STORE_DIR: /var/lib/talentos/payslips
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      RUST_LOG: ${RUST_LOG:-info,talentos=info}
    volumes:
      - payslip-data:/var/lib/talentos/payslips
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: talentos-web:latest
    build: ./web
    environment:
      TALENTOS_API_URL: http://gateway:8080
      TALENTOS_COOKIE_SECURE: ${TALENTOS_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  temporal-data:
  minio-data:
  payslip-data: