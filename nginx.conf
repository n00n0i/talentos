events {}

http {
    upstream talentos_web       { server web:3000; }
    upstream talentos_gateway   { server gateway:8080; }

    server {
        listen 80;
        client_max_body_size 20m;

        # Ops health check (bypasses the web app).
        location /health {
            proxy_pass http://talentos_gateway/health;
        }

        # Next.js route handlers (cookie session + gateway proxy) stay on web.
        location /api/gw/ {
            proxy_pass http://talentos_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/session/ {
            proxy_pass http://talentos_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct API access for MCP clients and integrations.
        location /api/ {
            proxy_pass http://talentos_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Browser UI: Next.js (which proxies /api/gw itself).
        location / {
            proxy_pass http://talentos_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
