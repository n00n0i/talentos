# Standalone guest crate: compiled to wasm32-wasip1, NOT part of the main workspace.
[package]
name = "bonus-calculator-thai"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
